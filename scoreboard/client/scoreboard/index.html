<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skorboard - Halı Saha</title>
  <meta name="description" content="Halı Saha Canlı Skorboard - Gerçek Zamanlı Maç Takibi">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/navigation.css">
  <link rel="stylesheet" href="scoreboard.css">
</head>
<body>
  <div class="bg-effects">
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>
  </div>

  <!-- Tüm bileşenler #scoreboard'un doğrudan çocuğu — hepsi position:absolute -->
  <div class="scoreboard" id="scoreboard">

    <!-- Bağımsız tesis logoları: editörden sol/sağ ayrı konumlandırılır. -->
    <div class="sb-comp sb-brand-logo" id="fieldLogoLeft"><img src="" alt="Tesis logosu"></div>
    <div class="sb-comp sb-brand-logo" id="fieldLogoRight"><img src="" alt="Tesis logosu"></div>

    <!-- Saha Bilgisi -->
    <div class="sb-comp sb-field-info" id="sbFieldInfo">
      <img src="" alt="Logo" class="field-logo" id="fieldLogo" style="display:none;">
      <h1 class="field-name" id="fieldName">Halı Saha</h1>
    </div>

    <!-- Devre -->
    <div class="sb-comp sb-period" id="periodBadge">
      <div class="period-content">
        <span class="period-indicator"></span>
        <span class="period-text" id="periodText">Maç Bekleniyor</span>
      </div>
      <span class="real-time-clock" id="realTimeClock" style="display:none;"></span>
    </div>

    <!-- Sayaç -->
    <div class="sb-comp sb-timer" id="timerSection">
      <div class="timer-display" id="timerDisplay">00:00</div>
    </div>

    <!-- Ev Sahibi -->
    <div class="sb-comp sb-team-panel sb-team-home" id="teamHome">
      <div class="team-logo-wrapper">
        <img src="" alt="" class="team-logo" id="homeTeamLogo" style="display:none;">
        <div class="team-logo-placeholder" id="homeLogoPlaceholder">🏠</div>
      </div>
      <div class="team-name" id="homeTeamName">Ev Sahibi</div>
      <div class="team-cards">
        <span class="card-badge yellow-badge" id="homeYellowCards">🟡 0</span>
        <span class="card-badge red-badge"    id="homeRedCards">🔴 0</span>
      </div>
    </div>

    <!-- Skor -->
    <div class="sb-comp sb-score" id="scoreDisplay">
      <div class="score-number score-home" id="scoreHome">0</div>
      <div class="score-separator">:</div>
      <div class="score-number score-away" id="scoreAway">0</div>
    </div>

    <!-- Deplasman -->
    <div class="sb-comp sb-team-panel sb-team-away" id="teamAway">
      <div class="team-logo-wrapper">
        <img src="" alt="" class="team-logo" id="awayTeamLogo" style="display:none;">
        <div class="team-logo-placeholder" id="awayLogoPlaceholder">✈️</div>
      </div>
      <div class="team-name" id="awayTeamName">Deplasman</div>
      <div class="team-cards">
        <span class="card-badge yellow-badge" id="awayYellowCards">🟡 0</span>
        <span class="card-badge red-badge"    id="awayRedCards">🔴 0</span>
      </div>
    </div>

    <!-- Son Gol -->
    <div class="sb-comp sb-last-goal" id="lastGoalBar" style="display:none;">
      <span class="last-goal-icon">⚽</span>
      <span class="last-goal-text" id="lastGoalText"></span>
    </div>

    <!-- Reklam Bandı -->
    <div class="sb-comp sb-ad-banner" id="adBanner" style="display:none;">
      <div class="ad-banner-content">
        <img src="" alt="Reklam" class="ad-image" id="adImage">
      </div>
    </div>

  </div>

  <!-- Fullscreen Reklam -->
  <div class="fullscreen-ad" id="fullscreenAd" style="display:none;">
    <img src="" alt="Reklam" id="fullscreenAdImage">
  </div>

  <button class="fullscreen-btn" id="fullscreenBtn" title="Tam Ekran">⛶</button>
  <button class="audio-enable-btn" id="audioEnableBtn" style="display:none;">🔊 Sesi etkinleştir</button>

  <div class="connection-status" id="connectionStatus">
    <span class="status-dot"></span>
    <span class="status-text">Bağlanıyor...</span>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/socket-client.js"></script>
  <script src="/shared/animations.js"></script>
  <script src="/shared/navigation.js"></script>
  <script src="scoreboard.js"></script>

  <!-- Ses Dosyaları -->
  <audio id="goalSound" preload="auto" volume="1.0">
    <source src="/shared/sounds/mackolik_goal.mp3" type="audio/mpeg">
  </audio>
  <audio id="matchStartSound" preload="auto" volume="1.0">
    <source src="/shared/sounds/mackolik_start.mp3" type="audio/mpeg">
  </audio>
</body>
</html>
