# Flutter web previews draw the same public images into a canvas. Permit those
# image reads from local preview origins without opening authenticated routes.
map $http_origin $mobile_preview_image_origin {
    default "";
    ~^http://localhost(:[0-9]+)?$ $http_origin;
    ~^http://127\.0\.0\.1(:[0-9]+)?$ $http_origin;
}

server {
    listen 80 default_server;
    server_name ytkampus.com www.ytkampus.com _;
    root /usr/share/nginx/html;
    index index.html;
    
    # Yönetici videosu için gerekli üst sınır; sınırsız disk tüketimini önler.
    client_max_body_size 100m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Bu başlık yalnızca HTTPS üzerinden tarayıcı tarafından uygulanır.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https://images.unsplash.com; media-src 'self' blob: https://commondatastorage.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://*.iyzipay.com; connect-src 'self' https://cdnjs.cloudflare.com https://*.iyzipay.com; frame-src https://*.iyzipay.com" always;

    # Chrome DevTools'un uygulama tanım dosyası sorgusu; SPA ana sayfasına düşmemeli.
    location = /.well-known/appspecific/com.chrome.devtools.json {
        default_type application/json;
        return 204;
    }

    # Match recordings must never be reachable as anonymous static files.
    location ^~ /uploads/ {
        return 404;
    }

    location ~ ^/(assets/images|site-images)/ {
        add_header Access-Control-Allow-Origin $mobile_preview_image_origin always;
        add_header Vary "Origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Flutter kayıt ekranı, webdeki KVKK ve üyelik metinlerini aynı kaynaktan
    # okuyabilsin. Yalnızca yerel geliştirme origin'lerine izin verilir.
    location ~ ^/pages/(legal/|auth/register\.html$) {
        add_header Access-Control-Allow-Origin $mobile_preview_image_origin always;
        add_header Vary "Origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    # Video player policy updates must reach the browser immediately.
    location = /mac-izle.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https://images.unsplash.com; media-src 'self' blob: https://commondatastorage.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://*.iyzipay.com; connect-src 'self' https://cdnjs.cloudflare.com https://*.iyzipay.com; frame-src https://*.iyzipay.com" always;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    # Serve SPA - all routes to index
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # URI'yi değiştirmeden API sunucusuna ilet.
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}

# Skorboard kendi alt alan adında çalışır. DNS ve TLS tanımlandığında bu blok
# doğrudan scoreboard.ytkampus.com trafiğini uygulamaya iletir.
server {
    listen 80;
    server_name scoreboard.ytkampus.com;
    client_max_body_size 10m;

    location / {
        proxy_pass http://scoreboard:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
